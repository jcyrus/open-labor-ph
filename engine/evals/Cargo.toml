[package]
name = "labor-evals"
version = "0.1.0"
edition = "2021"
authors = ["Hipstaff.asia <hello@hipstaff.asia>"]
description = "RAG evaluation framework for Philippine Labor Law LLM benchmarking"
license = "MIT"

[dependencies]
# HTTP Client for LLM APIs
reqwest = { version = "0.11", features = ["json"] }

# Async Runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error Handling
anyhow = { workspace = true }

# CSV Export
csv = "1.3"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive"] }
