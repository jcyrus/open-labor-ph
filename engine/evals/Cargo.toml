[package]
name = "labor-evals"
version = "0.1.0"
edition = "2021"
authors = ["Hipstaff.asia <hello@hipstaff.asia>"]
description = "RAG evaluation framework for Philippine Labor Law LLM benchmarking"
license = "MIT"

[lib]
name = "labor_evals"
path = "src/lib.rs"

[[bin]]
name = "evals"
path = "src/main.rs"

[dependencies]
labor-ingestion = { path = "../ingestion" }

# Citation and phrase matching
regex = "1.10"

# HTTP Client for LLM APIs
reqwest = { version = "0.11", features = ["json"] }

# Async Runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error Handling
anyhow = { workspace = true }

# CSV Export
csv = "1.3"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
