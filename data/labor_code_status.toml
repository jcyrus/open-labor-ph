# Reviewed legal status of Labor Code articles.
#
# Each entry was read against the footnote it cites in the DOLE renumbered
# edition. `parse-labor-code` turns this file into `metadata.legal_status` and
# fails on any status-like footnote listed in neither section below. The review
# only reports what the source edition says: `no_change_noted` does not mean an
# article is in force, because later laws are outside the edition.
#
#   source_sha256  PDF the review applies to; another PDF gets no legal_status.
#   [[change]]     A note saying articles no longer apply as printed.
#     articles     "131" or an inclusive range, "139-150".
#     footnote     Footnote stating the change, on the article or its heading.
#     effect       superseded, repealed, inoperative, obsolete, unconstitutional,
#                  functions_transferred or modified.
#     by           Law or decision that made the change.
#     part         The part affected. Omit it when the whole article is affected.
#   [[no_change]]  A footnote that reads like a status note but changes nothing.

