# Source manifest: every document the dataset is built from.
#
# Fields (see engine/ingestion/src/manifest.rs):
#   id              Dataset identifier and local file name (data/raw/<id>.pdf).
#                   Department Orders use the normalized order number.
#   kind            "dole_order" (parse-dole) or "labor_code" (parse-labor-code).
#   title           Human-readable title.
#   source_url      Official page for the document; recorded as `source_url`.
#   download_url    Direct PDF URL that `fetch` downloads. dole.gov.ph hosts sit
#                   behind a Cloudflare JavaScript challenge, so this is a Wayback
#                   Machine snapshot of the official PDF, and the pin proves its
#                   bytes. Without one, save the PDF by hand from source_url as
#                   data/raw/<id>.pdf instead.
#   published_date  Official publication date, YYYY-MM-DD, when verified. Used to
#                   resolve "N days after publication" effectivity clauses.
#   sha256          Pinned hash of the exact PDF. Written by `fetch --pin` after
#                   you have checked the file; a mismatch is a hard error.
#   ocr             true for a scan with no text layer. `ocr` writes the text once
#                   to data/ocr/<id>.txt; corrections go there, and parse-dole
#                   reads that file.
#   ocr_first_page  First page to OCR, for scans that open with a duplicate.
#   superseded_by   Order number that replaced this one.
#
# Workflow:
#   cargo run --release --bin fetch            # download / verify everything
#   cargo run --release --bin fetch -- --pin   # record hashes of new files

